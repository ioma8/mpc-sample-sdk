[package]
name = "mpc-sample-sdk"
description = "Rust mod SDK for the Akai MPC Sample firmware"
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ioma8/mpc-sample-sdk"
keywords = ["audio", "reverse-engineering", "firmware"]
categories = ["multimedia::audio"]

[dependencies]
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
